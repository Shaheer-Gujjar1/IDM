<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');
    
    :root {
      /* Dark Theme variables by default */
      --bg-primary: #030407;
      --bg-secondary: #0a0c13;
      --bg-card: rgba(20, 24, 35, 0.45);
      --bg-card-hover: rgba(28, 35, 50, 0.7);
      --border-color: rgba(255, 255, 255, 0.05);
      --border-hover: rgba(255, 255, 255, 0.15);
      
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      
      --accent-color: #3b82f6; /* Premium System Blue */
      --accent-hover: #2563eb;
      --accent-shadow: rgba(59, 130, 246, 0.4);
      --accent-foreground: #ffffff;

      --power-card-border: rgba(59, 130, 246, 0.15);
      --power-status-active: #60a5fa;
      --power-status-glow: rgba(96, 165, 250, 0.35);
    }
    
    @media (prefers-color-scheme: light) {
      :root {
        /* Premium Light Theme */
        --bg-primary: #f8fafc;
        --bg-secondary: #f1f5f9;
        --bg-card: rgba(255, 255, 255, 0.85);
        --bg-card-hover: rgba(255, 255, 255, 0.98);
        --border-color: rgba(15, 23, 42, 0.08);
        --border-hover: rgba(15, 23, 42, 0.16);
        
        --text-primary: #0f172a;
        --text-secondary: #475569;
        
        --accent-color: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-shadow: rgba(37, 99, 235, 0.25);
        --accent-foreground: #ffffff;

        --power-card-border: rgba(37, 99, 235, 0.15);
        --power-status-active: #2563eb;
        --power-status-glow: rgba(37, 99, 235, 0.15);
      }
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      user-select: none;
      transition: background 0.3s, color 0.3s;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
      transition: border-bottom 0.3s;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .brand-logo-img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }
    
    .brand-title {
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
    }
    
    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444; /* red by default */
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
      transition: all 0.3s ease;
    }
    
    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }
    
    /* Modern Power Card Style */
    .power-card {
      background: var(--bg-card);
      border: 1px solid var(--power-card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .power-card.disabled {
      border-color: var(--border-color);
      opacity: 0.75;
      box-shadow: none;
    }
    
    .power-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .power-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .power-status {
      font-size: 14px;
      font-weight: 700;
      color: var(--power-status-active);
      text-shadow: 0 0 10px var(--power-status-glow);
      transition: all 0.3s ease;
    }
    
    .power-card.disabled .power-status {
      color: var(--text-secondary);
      text-shadow: none;
    }
    
    .power-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--accent-color);
      color: var(--accent-foreground);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px var(--accent-shadow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .power-toggle-btn:hover {
      transform: scale(1.05);
      background: var(--accent-hover);
    }
    
    .power-toggle-btn svg {
      transition: transform 0.3s ease;
    }
    
    .power-toggle-btn:active svg {
      transform: scale(0.9);
    }
    
    .power-card.disabled .power-toggle-btn {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      box-shadow: none;
    }

    .btn-add-manually {
      width: 100%;
      background: var(--accent-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--accent-foreground);
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-shadow);
      transition: all 0.2s ease;
    }
    
    .btn-add-manually:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 16px var(--accent-shadow);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img class="brand-logo-img" src="icon.png" alt="IDM Logo">
      <span class="brand-title">IDM</span>
    </div>
    <div class="connection-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Checking app...</span>
    </div>
  </div>

  <div class="power-card" id="power-card">
    <div class="power-info">
      <span class="power-title">Interception Engine</span>
      <span class="power-status" id="power-status">Active</span>
    </div>
    <button class="power-toggle-btn" id="power-toggle-btn" aria-label="Toggle Engine">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
    </button>
  </div>

  <button class="btn-add-manually" id="btn-add-manually">Download this page as HTML</button>
  
  <script src="popup.js"></script>
</body>
</html>
